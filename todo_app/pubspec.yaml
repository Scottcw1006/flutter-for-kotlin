name: todo_app
description: "教學實作主線：待辦清單 App。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

# [snippet:arch-pubspec]
dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
# [/snippet]
  # 沒有指定 --flavor 時使用 dev，讓 flutter run 不用每次都加參數
  default-flavor: dev
