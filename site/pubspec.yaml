name: f4k_site
description: "給 Kotlin 開發者的 Flutter 教學網站：demo 以 multi-view 掛載到各章節 HTML 頁面。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  # 實作主線的待辦 App，網頁上的 demo 直接使用它的 Widget
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  todo_app:
    path: ../todo_app

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  # demo 用到的中文字子集，由 tool/subset_cjk_font.py 產生（Noto Sans TC，OFL 授權，見 fonts/OFL.txt）
  fonts:
    - family: NotoSansTCSubset
      fonts:
        - asset: fonts/NotoSansTC-Subset-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansTC-Subset-Medium.ttf
          weight: 500
