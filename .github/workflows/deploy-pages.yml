name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只保留一個部署；新的 push 不會中斷正在進行的部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 網頁上的 Compose 對照代碼來自這裡，必須能編譯
  android-samples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :compose-reference:compileDebugKotlin

  # 第 6 章的串接範例：Flutter App（channel、Pigeon、platform view）與 add-to-app 宿主
  flutter-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Build native_bridge
        working-directory: samples/native_bridge
        run: |
          flutter analyze
          flutter build apk --debug

      - name: Build add-to-app host with the Flutter module
        run: |
          cd samples/add_to_app/todo_module
          flutter pub get
          flutter analyze
          cd ../android_host
          ./gradlew :app:assembleDebug

  # 第 7 章的 Swift 代碼：沒有 Xcode 專案，直接對 Flutter.xcframework 做型別檢查
  ios-snippets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter precache --ios
      - run: samples/ios_snippets/typecheck.sh

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Test todo_app
        working-directory: todo_app
        run: |
          flutter analyze
          flutter test

      - name: Check CJK font subset covers all demo text
        working-directory: site
        run: |
          pip install fonttools
          python3 tool/subset_cjk_font.py --check

      - name: Build site
        working-directory: site
        run: |
          flutter analyze
          dart run tool/extract_snippets.dart
          flutter build web --wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [android-samples, flutter-samples, ios-snippets, site]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
