# 第 8 章：把待辦 App 上傳到 Google Play 內部測試軌道的 GitHub Actions 範例。
# 這個檔案放在 samples/ 只是示範，不會被 GitHub 執行；要使用時複製到 .github/workflows/，
# 並在 repo 的 Settings → Secrets 設定下面用到的四個 secret。
# [snippet:release-workflow]
name: Release Android

on:
  push:
    tags: ["v*"] # 推送 v1.2.0 這類 tag 時觸發

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      # keystore 以 base64 存在 secret 裡：base64 -i upload-keystore.jks | pbcopy
      - name: Restore upload keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          keyAlias=upload
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          PROPS

      # versionCode 用 CI 的執行編號，保證每次上傳都比上一次大
      - name: Build app bundle
        run: |
          flutter build appbundle --flavor prod \
            --dart-define-from-file=config/prod.json \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols

      # 混淆後的 Dart stack trace 要用這些符號檔還原，務必保存
      - uses: actions/upload-artifact@v4
        with:
          name: dart-symbols
          path: todo_app/build/symbols

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.f4k.todo_app
          releaseFiles: todo_app/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
# [/snippet]
